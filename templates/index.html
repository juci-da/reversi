<!DOCTYPE html>
<html><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
     <title>Reversi</title>
     <style>
        .center { display: flex; justify-content: center; align-items:  center;}
        .w-board {width: 400px;}
        .w-stone {width: 50px;}
     </style>
</head><body>
    <header class="center m-0 p-0 mb-2">
        <h1 class="title is-primary p-3 has-background-info w-board">
            リバーシ</h1>
    </header>
    <div class="m-0 p-0 center mb-2">
        <div id="board" class="box p-0 m-0 w-board">
            {% for y in range(0,8) %}
            <div style="line-height: 0;" class="p-0 m-0 is-flex">
                {% for x in range(0,8) %}
                    {% if can_place %}
                    <a class="p-0 m-0 w-stone"
                     href="/place/{{y}}/{{x}}?who={{me}}&token={{token}}">
                    {% else %}<a>{% endif %}
                        <img src="static/stone-{{ board[y][x] }}.png">
                    </a>
                {% endfor %}
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="m-0 p-0 center">
        <div class="p-3 box w-board">
            <div class="is-size-4 has-background-primary-light">
                <p class="p-3">{{ msg }}</p></div>
            <div class="is-size-6 has-text-right">
                石の数:●黒 {{count[0]}}/ ○白 {{count[1]}}
            </div>
            <hr>
            <div class="mb-3">
                <p>
                    <a href="/?who=1&token={{ black_token }}">黒プレイヤーとして参加</a>
                </p>
                <p>
                    <a href="/?who=2&token={{ white_token }}">白プレイヤーとして参加</a>
                </p>
            </div>
            <div>
                {% if can_place %}
                <a class="button" style="width: 8em;"
                 href="/skip?who={{me}}&token={{token}}">Skip</a>
                {% endif %}
                <a class="button" href="/reset?who={{ me }}&token={{ token }}">Reset</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
    const socket = io({
        transports: ["websocket", "polling"]
    });
    socket.on("connect", function () {
        console.log("Socket.IO接続成功:", socket.id);
    });
    socket.on("board_update", function () {
        console.log("盤面更新を受信しました");
        window.location.reload();
    });
    socket.on("disconnect", function () {
        console.log("Socket.IOの接続が切れました");
    });
    socket.on("connect_error", function (error) {
        console.error("Socket.IO接続エラー:", error);
    });
</script>
</body></html>
